[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogniheal-engine"
version = "1.0.0"
description = "Self-Reflective Dynamic Episodic Memory & Autonomous Self-Healing Agent Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "CogniHeal Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
[project.urls]
Homepage = "https://github.com/EvoderDev/CogniHeal-Engine"
Repository = "https://github.com/EvoderDev/CogniHeal-Engine"
Issues = "https://github.com/EvoderDev/CogniHeal-Engine/issues"

dependencies = [
    "chromadb>=0.4.22",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.7.0",
    "openai>=1.12.0",
    "tree-sitter>=0.21.0",
    "sqlite-utils>=3.36",
    "tenacity>=8.2.3",
    "numpy>=1.26.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
cogni = "cogniheal.cli:interactive_mode"
cg = "cogniheal.cli:interactive_mode"
cogniheal = "cogniheal.cli:main"

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*"]
